name: smk3

# =============================================================================
# SMK3 MONOREPO — seluruh aplikasi (frontend + backend) hanya
# terekspos lewat SATU port: service `gateway` (default 8080).
# Service lain tidak mem-publish port apa pun ke host.
# =============================================================================

services:
  # ===========================================================================
  # EDGE GATEWAY (SATU-SATUNYA PORT PUBLIK)
  # SPA React + reverse proxy ke api-gateway dan file upload.
  # ===========================================================================
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      - api-gateway
    networks:
      smk3_network:
        aliases:
          - sekolah_web
          - sekolah_nginx

  # ===========================================================================
  # INFRASTRUKTUR INTI
  # ===========================================================================
  db-auth:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - db_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      smk3_network:
        aliases:
          - db_auth

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    expose:
      - '5672'
    networks:
      smk3_network:
        aliases:
          - sekolah_rabbitmq

  # ===========================================================================
  # DATABASE MICROSERVICES
  # ===========================================================================
  db-pelanggaran:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_pelanggaran
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_pelanggaran_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d db_pelanggaran']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      smk3_network:
        aliases:
          - db_pelanggaran

  db-profile:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_profile
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_profile_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d db_profile']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      smk3_network:
        aliases:
          - db_profile

  db-berita:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_berita
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_berita_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d db_berita']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      smk3_network:
        aliases:
          - db_berita

  db-portofolio:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_portofolio
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_portofolio_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d db_portofolio']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      smk3_network:
        aliases:
          - db_portofolio

  db-management:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_management
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_management_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d db_management']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      smk3_network:
        aliases:
          - db_management

  # ===========================================================================
  # API GATEWAY (NESTJS)
  # ===========================================================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    restart: unless-stopped
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      - NODE_ENV=production
      # Semua request datang dari origin yang sama lewat gateway.
      - CORS_ORIGIN=${PUBLIC_ORIGIN}
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      # Autentikasi lokal: database akun + kunci penandatangan token.
      - DATABASE_URL=${AUTH_DB_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_SECONDS=${JWT_EXPIRES_SECONDS:-28800}
      - MASTER_ADMIN_USERNAME=${MASTER_ADMIN_USERNAME}
      - MASTER_ADMIN_PASSWORD=${MASTER_ADMIN_PASSWORD}
      - MASTER_ADMIN_NAMA=${MASTER_ADMIN_NAMA:-Master Admin}
      - SERVICE_PELANGGARAN_URL=${SERVICE_PELANGGARAN_URL}
      - SERVICE_PROFILE_URL=${SERVICE_PROFILE_URL}
      - SERVICE_BERITA_URL=${SERVICE_BERITA_URL}
      - SERVICE_PORTOFOLIO_URL=${SERVICE_PORTOFOLIO_URL}
      - SERVICE_MANAGEMENT_URL=${SERVICE_MANAGEMENT_URL}
    depends_on:
      db-auth:
        condition: service_healthy
      service-pelanggaran:
        condition: service_started
      service-profile:
        condition: service_started
      service-berita:
        condition: service_started
      service-portofolio:
        condition: service_started
      service-management:
        condition: service_started
    networks:
      smk3_network:
        aliases:
          - api_gateway

  # ===========================================================================
  # NESTJS SERVICES
  # ===========================================================================
  service-pelanggaran:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-pelanggaran
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${PUBLIC_ORIGIN}
      - DATABASE_URL=${DB_PELANGGARAN_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - PORT=${SERVICE_PELANGGARAN_PORT}
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
    depends_on:
      db-pelanggaran:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      smk3_network:
        aliases:
          - service_pelanggaran

  service-profile:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-profile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${PUBLIC_ORIGIN}
      - DATABASE_URL=${DB_PROFILE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - PORT=${SERVICE_PROFILE_PORT}
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
    volumes:
      - profile_uploads:/app/uploads
    depends_on:
      db-profile:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      smk3_network:
        aliases:
          - service_profile

  service-berita:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-berita
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${PUBLIC_ORIGIN}
      - DATABASE_URL=${DB_BERITA_URL}
      - PORT=${SERVICE_BERITA_PORT}
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      - TYPEORM_SYNC=true
    volumes:
      - berita_uploads:/app/uploads
    depends_on:
      db-berita:
        condition: service_healthy
    networks:
      smk3_network:
        aliases:
          - service_berita

  service-portofolio:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-portofolio
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${PUBLIC_ORIGIN}
      - DATABASE_URL=${DB_PORTOFOLIO_URL}
      - PORT=${SERVICE_PORTOFOLIO_PORT}
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
    volumes:
      - portofolio_uploads:/app/uploads/portofolio
    depends_on:
      db-portofolio:
        condition: service_healthy
    networks:
      smk3_network:
        aliases:
          - service_portofolio

  service-management:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-management
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${PUBLIC_ORIGIN}
      - DATABASE_URL=${DB_MANAGEMENT_URL}
      - DB_MANAGEMENT_URL=${DB_MANAGEMENT_URL}
      - DB_HOST=db-management
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PORT=${SERVICE_MANAGEMENT_PORT}
      - SERVICE_MANAGEMENT_PORT=${SERVICE_MANAGEMENT_PORT}
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
    volumes:
      - management_uploads:/app/uploads
    depends_on:
      db-management:
        condition: service_healthy
    networks:
      smk3_network:
        aliases:
          - service_management

# =============================================================================
# PERSISTENT STORAGE
# =============================================================================
volumes:
  db_auth_data:
  db_pelanggaran_data:
  db_profile_data:
  db_berita_data:
  db_portofolio_data:
  db_management_data:
  management_uploads:
  portofolio_uploads:
  profile_uploads:
  berita_uploads:

# =============================================================================
# NETWORK
# =============================================================================
networks:
  smk3_network:
    driver: bridge
