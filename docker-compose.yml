name: smk3

# =============================================================================
# SMK3 MONOREPO — seluruh aplikasi (frontend + backend) hanya
# terekspos lewat SATU port: service `gateway` (default 8080).
# Service lain tidak mem-publish port apa pun ke host.
# =============================================================================

x-database-url: &database-url
  DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}

services:
  # ===========================================================================
  # EDGE GATEWAY (SATU-SATUNYA PORT PUBLIK)
  # SPA React + reverse proxy ke api-gateway dan file upload.
  # ===========================================================================
  gateway:
    container_name: pkm-smk3-balige-gateway
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      - api-gateway
    networks:
      - delcom-external-network

  # ===========================================================================
  # API GATEWAY (NESTJS)
  # ===========================================================================
  api-gateway:
    container_name: pkm-smk3-balige-api-gateway
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    restart: unless-stopped
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      <<: *database-url
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-28800}
      MASTER_ADMIN_USERNAME: ${MASTER_ADMIN_USERNAME}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD}
      MASTER_ADMIN_NAMA: ${MASTER_ADMIN_NAMA:-Master Admin}
      SERVICE_PELANGGARAN_URL: ${SERVICE_PELANGGARAN_URL}
      SERVICE_PROFILE_URL: ${SERVICE_PROFILE_URL}
      SERVICE_BERITA_URL: ${SERVICE_BERITA_URL}
      SERVICE_PORTOFOLIO_URL: ${SERVICE_PORTOFOLIO_URL}
      SERVICE_MANAGEMENT_URL: ${SERVICE_MANAGEMENT_URL}
    depends_on:
      - service-pelanggaran
      - service-profile
      - service-berita
      - service-portofolio
      - service-management
    networks:
      - delcom-external-network

  # ===========================================================================
  # NESTJS SERVICES
  # ===========================================================================
  service-pelanggaran:
    container_name: pkm-smk3-balige-service-pelanggaran
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-pelanggaran
    restart: unless-stopped
    environment:
      <<: *database-url
      PORT: ${SERVICE_PELANGGARAN_PORT}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
    networks:
      - delcom-external-network

  service-profile:
    container_name: pkm-smk3-balige-service-profile
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-profile
    restart: unless-stopped
    environment:
      <<: *database-url
      PORT: ${SERVICE_PROFILE_PORT}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
    volumes:
      - ./uploads/profile:/app/uploads
    networks:
      - delcom-external-network

  service-berita:
    container_name: pkm-smk3-balige-service-berita
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-berita
    restart: unless-stopped
    environment:
      <<: *database-url
      NODE_ENV: production
      PORT: ${SERVICE_BERITA_PORT}
      TYPEORM_SYNC: 'true'
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
    volumes:
      - ./uploads/berita:/app/uploads
    networks:
      - delcom-external-network

  service-portofolio:
    container_name: pkm-smk3-balige-service-portofolio
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-portofolio
    restart: unless-stopped
    environment:
      <<: *database-url
      PORT: ${SERVICE_PORTOFOLIO_PORT}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
    volumes:
      - ./uploads/portofolio:/app/uploads/portofolio
    networks:
      - delcom-external-network

  service-management:
    container_name: pkm-smk3-balige-service-management
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_NAME: service-management
    restart: unless-stopped
    environment:
      <<: *database-url
      SERVICE_MANAGEMENT_PORT: ${SERVICE_MANAGEMENT_PORT}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
    volumes:
      - ./uploads/management:/app/uploads
    networks:
      - delcom-external-network

# =============================================================================
# NETWORK
# =============================================================================
networks:
  delcom-external-network:
    name: delcom-external-network
    driver: bridge
    external: true
    ipam:
      config:
        - subnet: 10.33.0.0/16
          gateway: 10.33.0.1
