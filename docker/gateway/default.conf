# =============================================================================
# EDGE GATEWAY — satu-satunya pintu masuk aplikasi (satu port).
# SPA React dilayani sebagai file statis, sisanya diproksikan ke service internal
# sehingga frontend dan API berbagi origin yang sama.
# =============================================================================

upstream api_gateway_upstream {
    server api-gateway:3000;
}

upstream berita_upstream {
    server service-berita:3003;
}

# Tunnel/reverse proxy di depan mengirim X-Forwarded-Proto; saat diakses langsung
# header itu kosong sehingga dipakai skema koneksi apa adanya.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "smk3 gateway ok\n";
    }

    # ---------------------------------------------------------------------
    # Backend (NestJS api-gateway)
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api_gateway_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Gambar berita/agenda/pengumuman yang disimpan service-berita
    location /uploads/ {
        proxy_pass http://berita_upstream/uploads/;
        include /etc/nginx/conf.d/proxy-common.inc;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ---------------------------------------------------------------------
    # SPA
    # ---------------------------------------------------------------------
    # Hashed build assets - can be cached long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Favicon, robots, manifest, etc.
    location ~* \.(?:ico|json|txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # NEVER cache index.html or SPA root navigation
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
